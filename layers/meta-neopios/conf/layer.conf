# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "neopios"
BBFILE_PATTERN_neopios = "^${LAYERDIR}/"
BBFILE_PRIORITY_neopios = "26"

LAYERSERIES_COMPAT_neopios = "wrynose"

LAYERDEPENDS_neopios = "core openembedded-layer openrc-layer security"