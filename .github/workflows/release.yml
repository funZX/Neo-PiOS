name: Build Release Images

# Trigger: push a version tag (YY.MM scheme, e.g. 26.08, 26.11)
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build:
    name: Build Neo-PiOS images (${{ github.ref_name }})
    # Self-hosted runner: WSL2 (Gentoo) + podman.
    # Register once with label 'yocto':
    #   ./config.sh --url https://github.com/funZX/Neo-PiOS --token <TOKEN> --labels yocto
    # Run persistently via OpenRC init script (see scripts/github-runner.initd).
    #
    # Persistent host => build/sstate-cache + downloads survive between runs:
    #   first build ~hours, subsequent tag builds ~20-40 min.
    runs-on: [self-hosted, yocto]
    timeout-minutes: 350

    steps:
      - name: Ensure podman
        run: |
          # Gentoo host: podman already emerged -> no-op.
          # Fallback (any Debian/Ubuntu-based host): install via apt.
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          podman --version

      - name: Checkout (with pinned submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build container image (linux-build-wrynose)
        run: |
          podman build \
            --build-arg "DOCKER_UID=$(id -u)" \
            --build-arg "DOCKER_GID=$(id -g)" \
            --build-arg "DOCKER_USER=ubuntu" \
            -t linux-build-wrynose \
            -f docker/Dockerfile docker

      - name: Build neopios-weston-image
        run: |
          podman run --rm \
            -v "$PWD":/home/ubuntu/workspace \
            -e "HOME=/tmp/ci-home" \
            -e "LANG=en_US.UTF-8" \
            --user "$(id -u):$(id -g)" \
            linux-build-wrynose \
            /bin/bash -c '
              set -euo pipefail
              cd /home/ubuntu/workspace
              source layers/openembedded-core/oe-init-build-env build
              bitbake neopios-weston-image
            '

      - name: Build neopios-labwc-image
        run: |
          podman run --rm \
            -v "$PWD":/home/ubuntu/workspace \
            -e "HOME=/tmp/ci-home" \
            -e "LANG=en_US.UTF-8" \
            --user "$(id -u):$(id -g)" \
            linux-build-wrynose \
            /bin/bash -c '
              set -euo pipefail
              cd /home/ubuntu/workspace
              source layers/openembedded-core/oe-init-build-env build
              bitbake neopios-labwc-image
            '

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -v build/tmp/deploy/images/raspberrypi4-64/*.wic.bz2 artifacts/ || true
          cp -v build/tmp/deploy/images/raspberrypi4-64/*.manifest artifacts/ || true
          ls -lh artifacts/

      - name: Upload artifacts to workflow (always)
        uses: actions/upload-artifact@v4
        with:
          name: neopios-images-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Attach images to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/*.wic.bz2 --clobber
