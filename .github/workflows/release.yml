name: Build Release Images
run-name: Building Release ${{ github.ref_name }}

# Trigger: push a version tag (YY.MM scheme, e.g. 26.08, 26.11)
# workflow_dispatch = manual "Run workflow" button (testing without a tag;
# release upload is skipped for manual runs).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: write   # required to upload assets to the release

# Self-hosted runner: WSL2 (Gentoo) + podman.
# - Register once with label 'yocto':
#     ./config.sh --url https://github.com/funZX/Neo-PiOS --token <TOKEN> --labels yocto
# - This workflow intentionally skips actions/checkout: the runner's _work
#   is symlinked to the local clone (warm build/sstate-cache + downloads).
# - Because there is no checkout, steps must NOT rely on the default cwd
#   (the runner auto-creates an empty _work/<pipeline>/<repo> dir).
#   Instead, add the absolute clone path to the runner's .env file:
#       ~/actions-runner/.env:  NEOPIOS_REPO_DIR=/home/<you>/path/to/Neo-PiOS
# - Persistent host => first build ~hours, subsequent tag builds ~20-40 min.
#
# NOTE: builds use whatever state the local clone is in — keep it on the
# tagged commit (master) when cutting a release.

jobs:
  build:
    name: Build Neo-PiOS images (${{ github.ref_name }})
    runs-on: [self-hosted, yocto]
    timeout-minutes: 350

    steps:
      - name: Build neopios-weston-image
        run: |
          cd "$NEOPIOS_REPO_DIR"
          podman run --rm \
            --userns=keep-id \
            --user ubuntu \
            -v "$NEOPIOS_REPO_DIR":/home/ubuntu/workspace \
            -e "LANG=en_US.UTF-8" \
            linux-build-wrynose \
            /bin/bash -c '
              cd /home/ubuntu/workspace
              source layers/openembedded-core/oe-init-build-env build
              bitbake -c cleansstate neopios-weston-image
              bitbake neopios-weston-image
            '

      - name: Build neopios-labwc-image
        run: |
          cd "$NEOPIOS_REPO_DIR"
          podman run --rm \
            --userns=keep-id \
            --user ubuntu \
            -v "$NEOPIOS_REPO_DIR":/home/ubuntu/workspace \
            -e "LANG=en_US.UTF-8" \
            linux-build-wrynose \
            /bin/bash -c '
              cd /home/ubuntu/workspace
              source layers/openembedded-core/oe-init-build-env build
              bitbake -c cleansstate neopios-labwc-image
              bitbake neopios-labwc-image
            '

      - name: Collect artifacts
        id: collect
        run: |
          cd "$NEOPIOS_REPO_DIR"
          rm -rf artifacts
          mkdir -p artifacts
          cp -v build/tmp/deploy/images/raspberrypi4-64/neopios-*-image-*.rootfs.wic.bz2 artifacts/ || true
          cp -v build/tmp/deploy/images/raspberrypi4-64/neopios-*-image-*.rootfs.manifest artifacts/ || true
          ls -lh artifacts/
          echo "artifact_dir=$(pwd)/artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to workflow (always)
        uses: actions/upload-artifact@v7
        with:
          name: neopios-images-${{ github.ref_name }}
          path: ${{ steps.collect.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 7

      - name: Attach images to GitHub release
        if: ${{ github.event_name == 'push' }}   # tags only; manual runs skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$NEOPIOS_REPO_DIR"
          gh release upload "${{ github.ref_name }}" artifacts/*.wic.bz2 --clobber
